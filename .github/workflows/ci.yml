name: CI

on:
  push:
    # ci/** lets a task check its builds before pushing to main. main must not go red.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*release.apk
          if-no-files-found: error
          retention-days: 3

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: tar -czf build/ios/ios-unsigned.tar.gz -C build/ios/iphoneos Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.sha }}
          path: build/ios/ios-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 3

  build-macos:
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --build-number=${{ github.run_number }}
      - run: python3 .github/scripts/package_desktop.py macos --build-number=${{ github.run_number }}
      - run: python3 .github/scripts/smoke_macos_package.py build/installers/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ github.sha }}
          path: build/installers/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-startup-diagnostics-${{ github.sha }}
          path: build/installers/*startup*
          if-no-files-found: ignore
          retention-days: 3

  build-windows:
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - run: .github/scripts/copy_windows_runtime.ps1
      - run: python .github/scripts/package_desktop.py windows --build-number=${{ github.run_number }}
      - run: .github/scripts/smoke_windows_package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: build/installers/*
          if-no-files-found: error
          retention-days: 3

  build-linux:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libnotify-dev dpkg-dev xvfb xdotool dbus-x11 gnome-keyring
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --build-number=${{ github.run_number }}
      - run: python3 .github/scripts/package_desktop.py linux --build-number=${{ github.run_number }}
      - run: sudo apt-get install -y ./build/installers/*.deb
      - run: dbus-run-session -- xvfb-run -a python3 .github/scripts/smoke_linux_package.py
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - run: sudo apt-get remove -y kaneo
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer-${{ github.sha }}
          path: build/installers/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-startup-diagnostics-${{ github.sha }}
          path: build/installers/*startup*
          if-no-files-found: ignore
          retention-days: 3
