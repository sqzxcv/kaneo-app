name: kaneo_app
description: "Flutter client for Kaneo."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cached_network_image: ^4.0.6
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  go_router: ^18.1.3
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.2
  markdown: ^7.3.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/i18n/overrides/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist_700Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono_500Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono_600SemiBold.ttf
          weight: 600
